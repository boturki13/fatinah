[project]
name = "fatinah-server"
version = "0.1.0"
description = "Fatinah game backend and native integrity verification services"
requires-python = ">=3.13"
dependencies = [
    "cbor2>=5.7.1",
    "cryptography>=50.0.0",
    "firebase-admin>=7.5.0",
]

[tool.setuptools]
py-modules = ["server", "firebase_admin_bridge", "app_attest"]
