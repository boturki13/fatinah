<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة أكواد فطنة</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;padding:24px;}
  h1{color:#f5c542;font-size:22px;margin-bottom:4px;}
  .sub{color:#7d8590;font-size:14px;margin-bottom:24px;}
  .card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px;margin-bottom:20px;}
  h2{font-size:16px;color:#c9d1d9;margin-bottom:14px;}
  label{display:block;font-size:13px;color:#8b949e;margin-bottom:4px;margin-top:12px;}
  input,select{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:15px;padding:9px 12px;font-family:inherit;outline:none;}
  input:focus,select:focus{border-color:#f5c542;}
  .btn{display:inline-block;background:#f5c542;color:#0d1117;border:none;border-radius:8px;padding:10px 20px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:14px;}
  .btn:hover{background:#ffd166;}
  .btn-danger{background:#da3633;color:#fff;}
  .btn-danger:hover{background:#f85149;}
  .btn-sm{padding:5px 12px;font-size:13px;margin-top:0;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:right;padding:8px 10px;color:#8b949e;border-bottom:1px solid #30363d;font-weight:600;}
  td{padding:8px 10px;border-bottom:1px solid #21262d;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;}
  .active{background:#1a4731;color:#56d364;}
  .inactive{background:#3d1f1f;color:#f85149;}
  #msg{padding:10px 14px;border-radius:8px;font-size:14px;margin-top:12px;display:none;}
  .ok{background:#1a4731;color:#56d364;}
  .err{background:#3d1f1f;color:#f85149;}
  .secret-row{display:flex;gap:10px;align-items:flex-end;}
  .secret-row input{flex:1;}
  .btn-secondary{background:#21262d;color:#c9d1d9;border:1px solid #30363d;}
  .btn-secondary:hover{background:#30363d;}
  #logout-btn{display:none;margin-top:12px;}
  .status-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:8px;font-size:14px;font-weight:700;}
  .status-ok{background:#1a4731;color:#56d364;}
  .status-warn{background:#3d2e00;color:#f5c542;}
  .status-err{background:#3d1f1f;color:#f85149;}
  .status-info{background:#1c2433;color:#79c0ff;}
  .check-step{font-size:13px;color:#8b949e;margin-top:10px;line-height:1.7;}
  .check-step a{color:#58a6ff;text-decoration:none;}
  .check-step a:hover{text-decoration:underline;}
  .badge-apple{background:#1c3a5e;color:#58a6ff;}
  .badge-stripe{background:#1a3a2a;color:#3fb950;}
  .badge-unknown{background:#2a2a2a;color:#8b949e;}
</style>
</head>
<body>
<h1>🎁 إدارة أكواد فطنة</h1>
<p class="sub">أنشئ أكواداً مجانية وراقب استخداماتها</p>

<div class="card" id="firebase-status-card">
  <h2>🔥 حالة Firebase Anonymous Auth</h2>
  <div id="anon-status"><span class="status-badge status-info">⏳ جارٍ الفحص…</span></div>
  <div id="anon-steps" class="check-step" style="display:none"></div>
</div>

<div class="card">
  <h2>🔐 كلمة مرور الإدارة</h2>
  <div class="secret-row">
    <div style="flex:1">
      <label>ADMIN_SECRET (من Replit Secrets)</label>
      <input type="password" id="secret" placeholder="أدخل كلمة المرور...">
    </div>
    <button class="btn" onclick="loadCodes()">تحميل الأكواد</button>
  </div>
  <button id="logout-btn" class="btn btn-secondary" onclick="logout()">🚪 تسجيل الخروج</button>
</div>

<div class="card">
  <h2>➕ إنشاء كود جديد</h2>
  <label>الكود (أحرف وأرقام)</label>
  <input type="text" id="new-code" placeholder="مثال: C90 أو FAMILY2026" style="text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()">
  <label>المدة (بالأيام)</label>
  <input type="number" id="new-days" value="30" min="1" max="3650">
  <label>الحد الأقصى للاستخدامات (اتركه فارغاً = بلا حد)</label>
  <input type="number" id="new-max" placeholder="فارغ = بلا حد" min="1">
  <label>ملاحظة (اختياري)</label>
  <input type="text" id="new-note" placeholder="مثال: تجربة مجانية لشهر">
  <button class="btn" onclick="createCode()">إنشاء الكود</button>
  <div id="msg"></div>
</div>

<div class="card">
  <h2>📋 الأكواد الحالية</h2>
  <div id="codes-table"><p style="color:#7d8590;font-size:14px;">اضغط "تحميل الأكواد" أولاً</p></div>
</div>

<div class="card">
  <h2>👥 المشتركون النشطون</h2>
  <div id="subscribers-table"><p style="color:#7d8590;font-size:14px;">اضغط "تحميل الأكواد" أولاً</p></div>
</div>

<script>
const BASE = window.location.origin;
const SESSION_KEY = 'admin_secret';

/** يحوّل القيمة إلى نص آمن للإدراج في innerHTML — يمنع Stored XSS */
function esc(str){
  if(str == null) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

async function checkAnonAuth(secret){
  try{
    const r = await fetch(BASE+'/api/auth/check-anonymous',{
      headers: secret ? {'X-Admin-Secret': secret} : {}
    });
    const d = await r.json();
    const el = document.getElementById('anon-status');
    const steps = document.getElementById('anon-steps');
    if(d.enabled === true){
      el.innerHTML = '<span class="status-badge status-ok">✅ Anonymous Auth مفعّل — التسجيل المجهول يعمل</span>';
      steps.style.display='none';
    } else if(d.enabled === false){
      el.innerHTML = '<span class="status-badge status-err">❌ Anonymous Auth غير مفعّل</span>';
      steps.innerHTML =
        '<b style="color:#f85149">⚠️ الخطوة المطلوبة:</b><br>' +
        'افتح <a href="https://console.firebase.google.com" target="_blank">Firebase Console</a> → Authentication → Sign-in method → Anonymous → Enable<br>' +
        'بدون ذلك تُحفظ نقاط اللاعبين بمعرّف جهاز محلي فقط (بلا مزامنة عبر الأجهزة).';
      steps.style.display='block';
    } else if(d.reason === 'not_configured'){
      el.innerHTML = '<span class="status-badge status-warn">⚠️ Firebase غير مُعدّ (FIREBASE_PROJECT_ID مفقود)</span>';
      steps.style.display='none';
    } else {
      el.innerHTML = `<span class="status-badge status-warn">⚠️ تعذّر الفحص: ${esc(d.reason)||'خطأ غير معروف'}</span>`;
      steps.style.display='none';
    }
  }catch(err){
    document.getElementById('anon-status').innerHTML =
      '<span class="status-badge status-warn">⚠️ تعذّر الاتصال بالخادم</span>';
  }
}


function getSecret(){ return document.getElementById('secret').value.trim(); }

function restoreSecret(){
  const saved = sessionStorage.getItem(SESSION_KEY);
  if(saved){ document.getElementById('secret').value = saved; loadCodes(); }
  else { checkAnonAuth(''); }
}

function showLogout(show){
  document.getElementById('logout-btn').style.display = show ? 'inline-block' : 'none';
}

function logout(){
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('secret').value = '';
  document.getElementById('codes-table').innerHTML = '<p style="color:#7d8590;font-size:14px;">اضغط "تحميل الأكواد" أولاً</p>';
  document.getElementById('subscribers-table').innerHTML = '<p style="color:#7d8590;font-size:14px;">اضغط "تحميل الأكواد" أولاً</p>';
  showLogout(false);
}


function showMsg(text, ok){
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = ok ? 'ok' : 'err';
  el.style.display = 'block';
  setTimeout(()=>el.style.display='none', 3000);
}

async function adminReq(data){
  const r = await fetch(BASE+'/api/promo/admin',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Admin-Secret':getSecret()},
    body:JSON.stringify(data)
  });
  return r.json();
}

async function createCode(){
  const code = document.getElementById('new-code').value.trim().toUpperCase();
  const days = parseInt(document.getElementById('new-days').value)||30;
  const maxV = document.getElementById('new-max').value.trim();
  const note = document.getElementById('new-note').value.trim();
  if(!code){ showMsg('أدخل الكود أولاً',false); return; }
  const d = await adminReq({action:'create',code,days,max_uses:maxV?parseInt(maxV):null,note});
  if(d.ok){ showMsg(`✅ تم إنشاء الكود "${code}" بمدة ${days} يوماً`,true); loadCodes(); }
  else showMsg('❌ '+(d.error||'خطأ'), false);
}

async function loadCodes(){
  checkAnonAuth(getSecret());
  const [d, ds] = await Promise.all([
    adminReq({action:'list'}),
    adminReq({action:'list_subscribers'})
  ]);
  if(d.error){ document.getElementById('codes-table').innerHTML=`<p style="color:#f85149">${d.error}</p>`; showLogout(false); return; }
  sessionStorage.setItem(SESSION_KEY, getSecret());
  showLogout(true);

  // ── أكواد المكافآت ──
  if(!d.codes.length){ document.getElementById('codes-table').innerHTML='<p style="color:#7d8590">لا توجد أكواد بعد</p>'; }
  else {
    let html=`<table><thead><tr>
      <th>الكود</th><th>المدة</th><th>الاستخدامات</th><th>الحالة</th><th>الملاحظة</th><th></th>
    </tr></thead><tbody>`;
    for(const c of d.codes){
      const usedNum = parseInt(c.used_count)||0;
      const maxNum  = c.max_uses ? parseInt(c.max_uses) : null;
      const uses    = maxNum ? `${usedNum}/${maxNum}` : String(usedNum);
      html+=`<tr>
        <td><b style="letter-spacing:2px">${esc(c.code)}</b></td>
        <td>${esc(String(c.days||0))} يوم</td>
        <td>${esc(uses)}</td>
        <td><span class="badge ${c.active?'active':'inactive'}">${c.active?'فعّال':'موقوف'}</span></td>
        <td style="color:#7d8590">${esc(c.note||'-')}</td>
        <td style="display:flex;gap:6px;">
          <button class="btn btn-sm js-toggle" data-code="${esc(c.code)}">${c.active?'إيقاف':'تفعيل'}</button>
          <button class="btn btn-sm btn-danger js-delete" data-code="${esc(c.code)}">حذف</button>
        </td>
      </tr>`;
    }
    html+='</tbody></table>';
    document.getElementById('codes-table').innerHTML=html;
  }

  // ── المشتركون النشطون ──
  if(ds.error){ document.getElementById('subscribers-table').innerHTML=`<p style="color:#f85149">${esc(ds.error)}</p>`; return; }
  if(!ds.subscribers.length){ document.getElementById('subscribers-table').innerHTML='<p style="color:#7d8590">لا يوجد مشتركون نشطون حالياً</p>'; return; }
  let sh=`<p style="color:#8b949e;font-size:13px;margin-bottom:10px;">الإجمالي: ${esc(String(ds.subscribers.length))} مشترك نشط</p>`;
  sh+=`<table><thead><tr>
    <th>الاسم</th><th>البريد</th><th>المصدر</th><th>آخر تحديث</th>
  </tr></thead><tbody>`;
  for(const s of ds.subscribers){
    const badgeCls = s.source==='Apple IAP' ? 'badge-apple' : (s.source==='Stripe' ? 'badge-stripe' : 'badge-unknown');
    const name = esc(s.display_name || s.uid.slice(0,12)+'…');
    const email = s.email ? esc(s.email) : '<span style="color:#7d8590">—</span>';
    const dt = s.updated_at ? esc(s.updated_at.replace('T',' ').replace(/\.\d+Z?$/,'')) : '—';
    sh+=`<tr>
      <td title="${esc(s.uid)}">${name}</td>
      <td>${email}</td>
      <td><span class="badge ${esc(badgeCls)}">${esc(s.source)}</span></td>
      <td style="color:#7d8590;font-size:12px;">${dt}</td>
    </tr>`;
  }
  sh+='</tbody></table>';
  document.getElementById('subscribers-table').innerHTML=sh;
}

// ── إدارة الأكواد عبر event delegation (بدلاً من onclick مضمَّن) ──
document.addEventListener('click', async function(e){
  const toggleBtn = e.target.closest('.js-toggle');
  const deleteBtn = e.target.closest('.js-delete');
  if(toggleBtn){
    const code = toggleBtn.dataset.code;
    const d = await adminReq({action:'toggle', code});
    if(d.ok) loadCodes(); else alert(d.error);
  } else if(deleteBtn){
    const code = deleteBtn.dataset.code;
    if(!confirm(`حذف الكود "${code}" نهائياً؟`)) return;
    const d = await adminReq({action:'delete', code});
    if(d.ok) loadCodes(); else alert(d.error);
  }
});

window.addEventListener('load', restoreSecret);
</script>
</body>
</html>
