name: بلاغ خلل
description: بلاغ قابل لإعادة الإنتاج دون بيانات حساسة
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: الملخص
      description: ماذا حدث وماذا كان متوقعًا؟
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: خطوات إعادة المشكلة
      placeholder: "1. افتح...\n2. اضغط...\n3. تظهر..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: الإصدار والبناء
      placeholder: "1.3 (9)"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: البيئة
      options:
        - Production
        - TestFlight
        - Staging
        - Local
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: الخصوصية
      options:
        - label: أزلت كلمات المرور والرموز وبيانات العملاء من البلاغ.
          required: true
