name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      verify_origin:
        description: HTTPS origin to verify (staging before release, ata20.com after release)
        required: false
        default: https://ata20.com
      verify_next_release:
        description: Also run the independent post-1.4 question-bank provenance gate
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_VERIFY_ORIGIN: ${{ inputs.verify_origin || (startsWith(github.ref, 'refs/heads/codex/') && vars.STAGING_RELEASE_ORIGIN) || 'https://ata20.com' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Scan repository and Git history for sensitive material
        run: npm run security:scan-history

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix functions
          uv sync --locked
          npx playwright install --with-deps chromium

      - name: Prepare generated test assets
        env:
          FATINAH_IMAGE_FETCH_ORIGIN: ${{ env.RELEASE_VERIFY_ORIGIN }}
        run: |
          # ios/App/App/public is ignored and absent on a clean checkout.
          npm run sync:ios
          node scripts/images/fetch-release-assets.mjs --asset=v1/fire-extinguisher.avif

      - name: Verify 1.4 runtime question-bank release artifacts
        run: npm run questions:release-gate

      - name: Verify independent next-release question-bank artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_next_release }}
        run: |
          npm run questions:next-release-gate
          git diff --exit-code -- \
            content/questions/next-release-factual-ledger.json \
            server-assets/question-bank/v1

      - name: Verify curated image-bank release artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm run images:build-curated-300
          generated_artifacts=(
            server-assets/question-images/curated-question-bank.json
            www/curated-image-options.js
          )
          for artifact in "${generated_artifacts[@]}"; do
            git ls-files --error-unmatch "$artifact" >/dev/null || {
              echo "Generated image release artifact is not tracked: $artifact" >&2
              exit 1
            }
          done
          git diff --exit-code -- "${generated_artifacts[@]}"

      - name: Refresh and verify generated iOS web bundle
        run: |
          npx cap copy ios
          node scripts/prune-ios-public.mjs
          node scripts/validate-ios-public.mjs

      - name: Run release metadata and static tests
        run: npm run test:static

      - name: Run deterministic source tests
        run: npm run test:deterministic-sources

      - name: Run content pipeline tests
        run: npm run test:web:content

      - name: Run account and purchase tests
        run: npm run test:web:account

      - name: Run gameplay tests
        run: npm run test:web:gameplay

      - name: Run responsive UI and accessibility tests
        run: npm run test:web:ui

      - name: Run server and Cloud Functions tests
        run: npm run test:server

  release-assets:
    name: Release asset integrity
    needs: core-tests
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Fetch and verify production image assets
        env:
          FATINAH_IMAGE_FETCH_ORIGIN: ${{ env.RELEASE_VERIFY_ORIGIN }}
        run: npm run images:fetch-release-assets

      - name: Verify curated image assets from release origin
        env:
          FATINAH_IMAGE_VERIFY_ORIGIN: ${{ env.RELEASE_VERIFY_ORIGIN }}
        run: npm run images:verify-curated-remote-assets

      - name: Verify deployed release contract
        env:
          FATINAH_VERIFY_ORIGIN: ${{ env.RELEASE_VERIFY_ORIGIN }}
        run: npm run release:verify-deployment

      - name: Run image release tests
        run: npm run test:images
