name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      verify_origin:
        description: HTTPS origin to verify (staging before release, ata20.com after release)
        required: false
        default: https://ata20.com

permissions:
  contents: read

env:
  RELEASE_VERIFY_ORIGIN: ${{ inputs.verify_origin || (startsWith(github.ref, 'refs/heads/codex/') && vars.STAGING_RELEASE_ORIGIN) || 'https://ata20.com' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Scan repository and Git history for sensitive material
        run: npm run security:scan-history

      - name: Install locked dependencies
        run: |
          npm ci
          uv sync --locked
          npx playwright install --with-deps chromium

      - name: Sync and verify iOS web bundle
        run: npm run sync:ios

      - name: Run release metadata and static tests
        run: npm run test:static

      - name: Run account and purchase tests
        run: npm run test:web

      - name: Run server tests
        run: npm run test:server

  release-assets:
    name: Release asset integrity
    needs: core-tests
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify deployed release contract
        env:
          FATINAH_VERIFY_ORIGIN: ${{ env.RELEASE_VERIFY_ORIGIN }}
        run: npm run release:verify-deployment
