name: iOS release gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -e .

      - name: Web, server, security, and content tests
        run: |
          npm test
          npm run questions:audit

      - name: Sync native iOS project
        run: npx cap sync ios

      - name: Swift Testing and XCUITest
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d.get("isAvailable") and "iPhone" in d["name"]))')
          xcodebuild test \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -destination "platform=iOS Simulator,id=${simulator_id}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unsigned Release build
        run: >-
          xcodebuild build
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          COMPILER_INDEX_STORE_ENABLE=NO
          CODE_SIGNING_ALLOWED=NO
